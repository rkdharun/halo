<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F5C"/>
      <stop offset="1" stop-color="#14162E"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="330" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.5" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEAF4"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g transform="translate(512 512) scale(0.9) translate(-512 -512)">
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>

  <g transform="translate(512 540) scale(0.9) translate(-512 -540)">
  <!-- note card -->
  <g filter="url(#shadow)" transform="rotate(-4 512 600)">
    <rect x="300" y="400" width="424" height="400" rx="56" fill="url(#paper)"/>
    <rect x="360" y="490" width="250" height="26" rx="13" fill="#2B2F5C" opacity="0.85"/>
    <rect x="360" y="560" width="300" height="20" rx="10" fill="#9A9CB8"/>
    <rect x="360" y="616" width="270" height="20" rx="10" fill="#9A9CB8"/>
    <rect x="360" y="672" width="190" height="20" rx="10" fill="#9A9CB8"/>
  </g>

  <!-- halo: glow, back half behind, front half over the card -->
  <ellipse cx="512" cy="318" rx="210" ry="62" fill="none" stroke="#FF9A3C" stroke-width="44" opacity="0.7" filter="url(#blur)"/>
  <ellipse cx="512" cy="318" rx="210" ry="62" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <ellipse cx="512" cy="312" rx="198" ry="54" fill="none" stroke="#FFF3D6" stroke-width="6" opacity="0.7"/>

  </g>
  <!-- subtle top edge highlight -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  </g>
</svg>
